services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adoption}
      POSTGRES_USER: ${POSTGRES_USER:-adoption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adoption-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adoption} -d ${POSTGRES_DB:-adoption}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adoption}
      POSTGRES_USER: ${POSTGRES_USER:-adoption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adoption-pass}
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    build: ./monitoring/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - web
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    build: ./monitoring/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  media:
  prometheus_data:
  grafana_data: